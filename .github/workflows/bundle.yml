# ============================================================
# چک بودجه‌ی باندل کلاینت در CI — سبز بودن بیلد + بدون هشدار + حجم در بودجه
# سامانه‌ی مدیریت تجهیزات و قطعات یدکی — طراح: میثم ایجادی / Meysam Ijadi
# -------------------------------------------------------------------
# روی هر push، PR و اجرای دستی اجرا می‌شود. اسکریپت خودش بیلد واقعی
# production (tsc -b && vite build) را اجرا می‌کند، خروجی را برای هشدارهای
# باندلینگ (مثل INEFFECTIVE_DYNAMIC_IMPORT یا chunk size) اسکن می‌کند و
# حجم gzip چانک‌ها را با بودجه‌ی ثابت (scripts/check-bundle-budget.mjs) می‌سنجد.
# هشدار یا عبور از بودجه → job قرمز می‌شود؛ یعنی کدی که صفحه‌ی سنگین را از
# چانک اولیه جدا نکند یا چانک اول را ناگهانی بزرگ کند، در merge رد می‌شود.
#
# سرعت‌بخشی: کش npm (setup-node@v7) شامل باینری‌های prebuilt ابزارهاست؛
# npm ci --prefer-offline از کش استفاده می‌کند بدون revalidation شبکه؛
# concurrency اجرای قدیمیِ همان ref را هنگام push پشت‌سرهم لغو می‌کند.
# ============================================================
name: Client bundle budget

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bundle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle-budget:
    name: Client — build بدون هشدار + بودجه‌ی حجم
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Build & budget check
        run: node scripts/check-bundle-budget.mjs
