# ============================================================
# پابلیش خودکار image داکر روی Docker Hub
# سامانه‌ی مدیریت تجهیزات و قطعات یدکی — طراح: میثم ایجادی / Meysam Ijadi
#   M.Ijadi@Hotmail.com — +98 902 296 4006
# ----------------------------------------------------------------
# تریگرها:
#   • push تگ ورژن (مثل v1.2.1)      → تگ‌های 1.2.1 / 1.2 / 1 / latest
#   • انتشار Release در گیت‌هاب      → همان تگ‌ها
#   • اجرای دستی (workflow_dispatch) → فقط تگ manual
# پیش‌نیاز (یک‌بار): دو Secret در Settings → Secrets and variables → Actions:
#   • DOCKERHUB_USERNAME = meysam8498
#   • DOCKERHUB_TOKEN    = توکن Access با دسترسی Read/Write
#     (hub.docker.com → Account Settings → Security → New Access Token)
# ============================================================
name: Publish Docker image

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:

# اگر برای یک نسخه، هم تگ push شود و هم Release ساخته شود،
# فقط آخرین اجرا ادامه می‌دهد (خروجی یکسان است؛ دوبیلد زائد حذف می‌شود).
concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docker-hub:
    name: Build & push to Docker Hub
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # تگ‌ها از نام تگ گیت ساخته می‌شوند: v1.2.1 → 1.2.1، 1.2، 1 (+ latest)
      - name: Docker meta (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: meysam8498/support-equipment-management
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ github.event_name != 'workflow_dispatch' }}
            type=raw,value=manual,enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          # نسخه‌ی OCI LABEL داخل Dockerfile از تگ گیت پر می‌شود
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
