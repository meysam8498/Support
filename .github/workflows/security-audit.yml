# ============================================================
# پایش آسیب‌پذیری وابستگی‌های production
# سبز بودن امروز کافی نیست: هر push/PR و هر هفته یک بار بررسی می‌شود تا
# یک CVE تازه در وابستگی‌های runtime بی‌خبر وارد نشود.
# ============================================================
name: Dependency audit

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: '0 4 * * 1' # دوشنبه ۰۴:۰۰ UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: npm audit (production)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      # فقط وابستگی‌های runtime؛ آسیب‌پذیری dev-toolها بیلد مشتری را تهدید نمی‌کند
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
