# ============================================================
# docker compose up - build & run the Support Equipment Management system.
# پلتفرم مدیریت پروژه و تجهیزات — طراح: میثم ایجادی / Meysam Ijadi
#   ایمیل: M.Ijadi@Hotmail.com — تلفن: +98 902 296 4006
#
# یک کانتینر که هم API و هم فرانت‌اند بیلدشده را روی پورت 4000 سرو می‌کند.
# داده‌های SQLite در volume با نام app-data ماندگار هستند.
#
# امکانات: کاتالوگ قطعات، یکتایی سریال، جست‌وجوی پیشرفته، ورود سریال‌ها از اکسل یا paste،
#          گرید جدولی قطعات، گارانتی، تأمین قطعات، تقویم شمسی.
# نسخه: 1.34.1
# ============================================================

services:
  app:
    # برای build محلی؛ اگر image پابلیش‌شده دارید، خط build را حذف کنید
    # و image را به‌روز کنید.
    build:
      context: .
      dockerfile: Dockerfile
    image: meysam8498/support-equipment-management:latest
    container_name: support-equipment-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-4000}:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DB_PATH=/app/server/data/app.db
      # JWT: مقدار پیش‌فرض عمداً خالی است (قبلاً یک رشته‌ی نمونه‌ی معلوم بود که هر
      # خواننده‌ی مخزن می‌توانست با آن توکن جعل کند). اگر تنظیم نشود، سرور یک secret
      # تصادفی می‌سازد و در data/jwt-secret.txt نگه می‌دارد (بین ری‌استارت‌ها پایدار).
      # برای کنترل کامل: JWT_SECRET=$(openssl rand -hex 32) در فایل .env (gitignored).
      - JWT_SECRET=${JWT_SECRET:-}
      - JWT_EXPIRES_HOURS=${JWT_EXPIRES_HOURS:-12}
      # کاربران اولیه (فقط در راه‌اندازی اولیه اعمال می‌شوند)
      # ADMIN_PASSWORD اجباری است — پیش‌فرض admin123 حذف شد تا نصب بدون .env بالا نیاید.
      # ساخت رمز: openssl rand -base64 18
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?ADMIN_PASSWORD را در فایل .env بگذارید (openssl rand -base64 18)}
      # بقیه‌ی نقش‌ها فقط اگر رمز بدهید ساخته می‌شوند (خالی = ساخته نمی‌شود، بعداً از UI)
      - USER_USERNAME=${USER_USERNAME:-user}
      - USER_PASSWORD=${USER_PASSWORD:-}
      - WAREHOUSE_USERNAME=${WAREHOUSE_USERNAME:-warehouse}
      - WAREHOUSE_PASSWORD=${WAREHOUSE_PASSWORD:-}
      - SALES_USERNAME=${SALES_USERNAME:-sales}
      - SALES_PASSWORD=${SALES_PASSWORD:-}
      - TECH_USERNAME=${TECH_USERNAME:-tech}
      - TECH_PASSWORD=${TECH_PASSWORD:-}
      # لایسنس/سقف آزمایشی — در نسخه‌ی فعلی پیش‌فرض‌ها خاموش‌اند (فقط گزارش/هشدار)
      - LICENSE_ENFORCE=${LICENSE_ENFORCE:-0}
      - TRIAL_DEVICE_LIMIT=${TRIAL_DEVICE_LIMIT:-25}
      - TRIAL_LIMIT_ENFORCE=${TRIAL_LIMIT_ENFORCE:-0}
      # کلید عمومی امضای کد لایسنس — پیش‌فرض: کلید داخل image کافی است؛
      # فقط اگر کلید خودتان را چرخاندید، PEM کامل را در .env بگذارید (\n = newline)
      - LICENSE_PUBLIC_KEY=${LICENSE_PUBLIC_KEY:-}
    volumes:
      - app-data:/app/server/data
      - backup-data:/app/server/backups
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 8s
      retries: 3

volumes:
  app-data:
    driver: local
  backup-data:
    driver: local
