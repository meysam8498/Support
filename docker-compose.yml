# ============================================================
# docker compose up - build & run the Support Equipment Management system.
# پلتفرم مدیریت پروژه و تجهیزات — طراح: میثم ایجادی / Meysam Ijadi
#   ایمیل: M.Ijadi@Hotmail.com — تلفن: +98 902 296 4006
#
# یک کانتینر که هم API و هم فرانت‌اند بیلدشده را روی پورت 4000 سرو می‌کند.
# داده‌های SQLite در volume با نام app-data ماندگار هستند.
#
# امکانات: کاتالوگ قطعات، یکتایی سریال، جست‌وجوی پیشرفته، ورود سریال‌ها از اکسل یا paste،
#          گرید جدولی قطعات، گارانتی، تأمین قطعات، تقویم شمسی.
# نسخه: 1.24.1
# ============================================================

services:
  app:
    # برای build محلی؛ اگر image پابلیش‌شده دارید، خط build را حذف کنید
    # و image را به‌روز کنید.
    build:
      context: .
      dockerfile: Dockerfile
    image: meysam8498/support-equipment-management:latest
    container_name: support-equipment-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-4000}:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DB_PATH=/app/server/data/app.db
      # JWT: حتماً قبل از دیپلوی، JWT_SECRET را به یک رشته‌ی طولانی تصادفی تغییر دهید.
      # می‌توانید آن را در فایل .env (که در گیت نادیده گرفته می‌شود) قرار دهید.
      - JWT_SECRET=${JWT_SECRET:-please-change-this-secret-in-production-9f2a4c7e1b8d}
      - JWT_EXPIRES_HOURS=${JWT_EXPIRES_HOURS:-12}
      # کاربران پیش‌فرض (فقط در راه‌اندازی اولیه اعمال می‌شوند)
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
      - USER_USERNAME=${USER_USERNAME:-user}
      - USER_PASSWORD=${USER_PASSWORD:-user123}
      - WAREHOUSE_USERNAME=${WAREHOUSE_USERNAME:-warehouse}
      - WAREHOUSE_PASSWORD=${WAREHOUSE_PASSWORD:-warehouse123}
      - SALES_USERNAME=${SALES_USERNAME:-sales}
      - SALES_PASSWORD=${SALES_PASSWORD:-sales123}
      - TECH_USERNAME=${TECH_USERNAME:-tech}
      - TECH_PASSWORD=${TECH_PASSWORD:-tech123}
      # لایسنس/سقف آزمایشی — در نسخه‌ی فعلی پیش‌فرض‌ها خاموش‌اند (فقط گزارش/هشدار)
      - LICENSE_ENFORCE=${LICENSE_ENFORCE:-0}
      - TRIAL_DEVICE_LIMIT=${TRIAL_DEVICE_LIMIT:-25}
      - TRIAL_LIMIT_ENFORCE=${TRIAL_LIMIT_ENFORCE:-0}
      # کلید عمومی امضای کد لایسنس — پیش‌فرض: کلید داخل image کافی است؛
      # فقط اگر کلید خودتان را چرخاندید، PEM کامل را در .env بگذارید (\n = newline)
      - LICENSE_PUBLIC_KEY=${LICENSE_PUBLIC_KEY:-}
    volumes:
      - app-data:/app/server/data
      - backup-data:/app/server/backups
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 8s
      retries: 3

volumes:
  app-data:
    driver: local
  backup-data:
    driver: local
